<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Kingdom Connect</title>
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4a0e1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kingdom Connect" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      .kc-boot {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        overflow: auto;
        background: #f7f1ea;
        color: #4a0e1a;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .kc-boot img {
        width: clamp(6rem, 18vw, 8rem);
        height: auto;
        border-radius: 1.5rem;
      }
      .kc-boot p {
        margin: 0;
        max-width: 30ch;
        font-size: 1rem;
        line-height: 1.5;
      }
      .kc-boot-indicator {
        width: 2rem;
        height: 3px;
        border-radius: 100px;
        background: #a86c23;
      }
      .kc-boot button {
        min-height: 44px;
        padding: 0.5rem 1.25rem;
        border: 1px solid currentColor;
        border-radius: 100px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .kc-boot button:focus-visible {
        outline: 2px solid #4a0e1a;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .kc-boot-indicator {
          animation: kc-pulse 1.6s ease-in-out infinite;
        }
      }
      @keyframes kc-pulse {
        50% {
          opacity: 0.45;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <main class="kc-boot">
        <img src="/icons/boot.jpg" alt="Kingdom Connect" width="176" height="176" />
        <p id="kc-boot-status" role="status" hidden>Loading…</p>
        <span id="kc-boot-indicator" class="kc-boot-indicator" aria-hidden="true" hidden></span>
        <button id="kc-boot-retry" type="button" hidden>Try again</button>
        <noscript><p>Enable JavaScript to open Kingdom Connect.</p></noscript>
      </main>
    </div>
    <script>
      (() => {
        let kiswahili = false;
        try {
          kiswahili = localStorage.getItem("kc.language") === "sw";
        } catch {
          // The loading screen also works when storage is unavailable.
        }
        const status = document.getElementById("kc-boot-status");
        const indicator = document.getElementById("kc-boot-indicator");
        const retry = document.getElementById("kc-boot-retry");
        if (kiswahili) {
          document.documentElement.lang = "sw";
          status.textContent = "Inapakia…";
          retry.textContent = "Jaribu tena";
        }
        status.hidden = false;
        indicator.hidden = false;
        retry.addEventListener("click", () => window.location.reload());
        window.setTimeout(() => {
          if (!status.isConnected) return;
          status.textContent = kiswahili
            ? "Programu inachukua muda kufunguka."
            : "The app is taking a while to open.";
          indicator.hidden = true;
          retry.hidden = false;
        }, 12000);
      })();
    </script>
  </body>
</html>
