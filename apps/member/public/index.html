<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Kingdom Connect</title>
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4a0e1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kingdom Connect" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      .kc-boot {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #4a0e1a;
        color: #f6efe6;
        font-family: Georgia, "Times New Roman", serif;
      }
      .kc-boot img {
        border-radius: 22px;
      }
      .kc-boot p {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.02em;
      }
      .kc-dots {
        display: flex;
        gap: 6px;
      }
      .kc-dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e3b04b;
        opacity: 0.35;
        animation: kc-pulse 1.2s ease-in-out infinite;
      }
      .kc-dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .kc-dots i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes kc-pulse {
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .kc-dots i {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="kc-boot" role="status" aria-label="Kingdom Connect is loading">
        <img src="/icons/boot.jpg" alt="" width="88" height="88" />
        <p>Kingdom Connect</p>
        <span class="kc-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
  </body>
</html>
