<title>Kingdom Connect Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: framed app window (navy sidebar + two-column dashboard) under a slim prototype control strip; sidebar becomes a bottom tab bar on phones. Visual direction follows the team's mockup. */
:root{
  --navy:#0e1d3a; --navy-2:#162a50; --navy-ink:#c9d6ee; --navy-mute:#8496b8;
  --blue:#1f5fd6; --blue-ink:#ffffff; --blue-soft:#e8effc;
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#f6f8fc; --line:#dfe5ef;
  --ink:#152039; --ink-2:#4a5672; --ink-3:#7a849b;
  --good:#1a8a55; --good-soft:#e3f5ec; --warn:#b26a00; --warn-soft:#fdf1dc;
  --bad:#c23b3b; --bad-soft:#fbe7e7; --violet:#6a42c2; --violet-soft:#efe9fb;
  --teal:#0e7d86; --teal-soft:#e0f3f4; --rose:#b23a73; --rose-soft:#fae6f0;
  --shadow:0 1px 2px rgba(14,29,58,.06),0 4px 14px rgba(14,29,58,.05);
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --navy:#081227; --navy-2:#13213f; --navy-ink:#c9d6ee; --navy-mute:#7b8db0;
    --blue:#4d86f0; --blue-ink:#ffffff; --blue-soft:#1a2b4f;
    --bg:#0b1222; --surface:#121c31; --surface-2:#18243d; --line:#24324f;
    --ink:#e6ecf7; --ink-2:#aab6cd; --ink-3:#7d8aa4;
    --good:#4cc78a; --good-soft:#123326; --warn:#f0a93a; --warn-soft:#352612;
    --bad:#ef7373; --bad-soft:#3a1a1d; --violet:#a98af0; --violet-soft:#261d42;
    --teal:#4cc3cc; --teal-soft:#0f2f33; --rose:#ee8ab9; --rose-soft:#3a1a2b;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --navy:#081227; --navy-2:#13213f; --navy-ink:#c9d6ee; --navy-mute:#7b8db0;
  --blue:#4d86f0; --blue-ink:#ffffff; --blue-soft:#1a2b4f;
  --bg:#0b1222; --surface:#121c31; --surface-2:#18243d; --line:#24324f;
  --ink:#e6ecf7; --ink-2:#aab6cd; --ink-3:#7d8aa4;
  --good:#4cc78a; --good-soft:#123326; --warn:#f0a93a; --warn-soft:#352612;
  --bad:#ef7373; --bad-soft:#3a1a1d; --violet:#a98af0; --violet-soft:#261d42;
  --teal:#4cc3cc; --teal-soft:#0f2f33; --rose:#ee8ab9; --rose-soft:#3a1a2b;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}

/* prototype strip */
.proto{max-width:1440px;margin:0 auto 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:12.5px;color:var(--ink-2)}
.proto b{color:var(--ink);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}
.proto .note{margin-left:auto;color:var(--ink-3)}

/* app frame */
.app{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);min-height:820px}
.side{background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;padding:18px 12px 16px;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff}
.brand .name{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;font-size:18px;color:#fff;line-height:1.1}
.brand .tag{font-size:10.5px;color:var(--navy-mute);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--navy-ink);padding:9px 10px;border-radius:9px;text-align:left;font-weight:500;font-size:13.5px}
.nav button:hover{background:var(--navy-2)}
.nav button.on{background:var(--blue);color:#fff;font-weight:600}
.nav .badge{margin-left:auto;background:#e0475b;color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 6px}
.nav .sub{display:flex;flex-direction:column;gap:1px;margin:0 0 4px 40px}
.nav .sub button{padding:5px 8px;font-size:12.5px;color:var(--navy-mute)}
.nav .sub button:hover{color:#fff}
.report{margin-top:auto;border:1px solid var(--navy-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.03)}
.report .h{display:flex;gap:8px;align-items:center;font-weight:700;color:#fff;font-size:13px}
.report p{margin:0;font-size:12px;color:var(--navy-mute)}
.staffnote{margin-top:auto;font-size:12px;color:var(--navy-mute);padding:0 8px}

.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink-3)}
.search input{border:0;background:none;outline:none;flex:1;font:inherit;color:var(--ink);min-width:0}
.top .sp{flex:1}
.iconbtn{position:relative;border:0;background:none;padding:6px;border-radius:8px;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .dot{position:absolute;top:1px;right:0;background:#e0475b;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:10px}
.me .who{display:flex;flex-direction:column;line-height:1.2}
.me .who b{font-size:13px}
.me .who span{font-size:11.5px;color:var(--ink-3)}

.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.av.lg{width:56px;height:56px;font-size:18px}
.av.sm{width:34px;height:34px;font-size:12px}

.content{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:22px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.welcome{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.welcome h1{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.02em;text-wrap:balance}
.welcome p{margin:4px 0 0;color:var(--ink-2)}
.when{text-align:right;color:var(--ink-2);font-size:12.5px}
.when b{display:block;color:var(--ink);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card > .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0}
.card > .hd h2{margin:0;font-size:15.5px;font-weight:700}
.card > .hd .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.card > .bd{padding:14px 18px 18px}
.link{border:0;background:none;color:var(--blue);font-weight:600;font-size:12.5px;padding:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:16px;display:flex;flex-direction:column;gap:10px}
.stat .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.stat .lbl{font-size:12.5px;color:var(--ink-2);font-weight:500}
.stat .val{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat .foot{font-size:11.5px;color:var(--ink-3)}
button.stat{text-align:left;border:1px solid var(--line)}
button.stat:hover{border-color:var(--blue)}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);position:relative}
.pcard .row{display:flex;gap:10px;align-items:center}
.pcard .nm{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:4px}
.pcard .ttl{font-size:12px;color:var(--ink-2)}
.pcard .loc{font-size:11.5px;color:var(--ink-3);display:flex;gap:4px;align-items:center}
.vf{color:var(--good)}
.why{font-size:11.5px;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:3px 7px;align-self:flex-start;font-weight:600}
.skills{display:flex;flex-wrap:wrap;gap:5px}
.skill{font-size:11px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);border-radius:6px;padding:2px 7px}
.actions{display:flex;gap:6px;margin-top:auto}
.btn{border:0;border-radius:8px;padding:8px 12px;font-weight:600;font-size:12.5px;background:var(--blue);color:var(--blue-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.full{flex:1}
.btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.btn.pending{background:var(--warn-soft);color:var(--warn)}
.btn.done{background:var(--good-soft);color:var(--good)}
.btn.more{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);padding:8px}
.menu{position:absolute;right:14px;bottom:52px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:4px;z-index:5;display:flex;flex-direction:column;min-width:150px}
.menu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--bad)}

.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.req{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.req:first-child{border-top:0;padding-top:4px}
.req .tx{flex:1;min-width:0}
.req .tx b{font-size:13px}
.req .tx .t{font-size:12px;color:var(--ink-2)}
.req .tx .note{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 8px;margin-top:6px}
.req .tx .ago{font-size:11px;color:var(--ink-3);margin-top:4px}
.req .acts{display:flex;flex-direction:column;gap:6px}
.empty{color:var(--ink-3);font-size:12.5px;padding:8px 0}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.li{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ti{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.li b{font-size:13px;font-weight:600;display:block}
.li .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-3);margin-top:3px}

.chip{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;letter-spacing:.02em;white-space:nowrap}
.c-job{background:var(--good-soft);color:var(--good)}
.c-train{background:var(--warn-soft);color:var(--warn)}
.c-inv{background:var(--violet-soft);color:var(--violet)}
.c-tender{background:var(--teal-soft);color:var(--teal)}
.c-idea{background:var(--rose-soft);color:var(--rose)}
.c-event{background:var(--blue-soft);color:var(--blue)}

.feat{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.feat:first-child{border-top:0;padding-top:2px}
.logo{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.feat .tx{flex:1;min-width:0}
.feat .tx b{font-size:13px;display:block}
.feat .tx .org{font-size:12px;color:var(--ink-2)}
.feat .tx .meta{font-size:11.5px;color:var(--ink-3);display:flex;gap:4px;align-items:center;margin-top:3px}
.feat .rt{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.slots{font-size:12px;color:var(--ink-3)}

.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.qa button:hover{border-color:var(--blue)}
.qa .qi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.qa b{font-size:12.5px}
.qa span{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.qa button.locked{background:var(--surface-2);border-style:dashed}
.qa button.locked b{color:var(--ink-3)}
.qa button.locked span{color:var(--blue);font-weight:600}

.act{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act > div{background:var(--surface-2);border-radius:10px;padding:10px;min-width:0;overflow-wrap:anywhere}
.act .v{font-size:20px;font-weight:800}
.act .l{font-size:11.5px;color:var(--ink-2)}
.act .s{font-size:11px;color:var(--ink-3);margin-top:2px}

.news{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.news:first-child{border-top:0;padding-top:2px}
.news .art{width:76px;height:60px;border-radius:9px;flex:none}
.news b{font-size:13px;display:block}
.news p{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
.news .d{font-size:11px;color:var(--ink-3);margin-top:4px;display:flex;gap:6px;align-items:center}

.banner{margin:0 22px 22px;border-radius:var(--r);background:var(--navy);color:#fff;padding:18px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.banner b{font-size:15px}
.banner span{display:block;font-size:12.5px;color:var(--navy-mute)}
.banner .btn{background:#fff;color:var(--navy)}

.group{display:flex;flex-direction:column;gap:10px}
.group h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

.tabbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1200px){.content{grid-template-columns:minmax(0,1fr)}}
@media (max-width:880px){
  body{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .app{grid-template-columns:minmax(0,1fr);min-height:0}
  .side{display:none}
  .top{padding:10px 14px;flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none}
  .me .who{display:none}
  .content{padding:14px;gap:14px}
  .banner{margin:0 14px 14px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20;justify-content:space-around}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-3);padding:4px 6px;position:relative}
  .tabbar button.on{color:var(--blue)}
  .tabbar .badge{position:absolute;top:0;right:8px;background:#e0475b;color:#fff;font-size:9.5px;font-weight:700;min-width:15px;height:15px;border-radius:999px;display:grid;place-items:center;padding:0 3px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:460px){
  .qa{grid-template-columns:1fr}
  .welcome h1{font-size:22px}
  .when{text-align:left}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="proto" role="region" aria-label="Prototype controls">
  <b>Prototype</b>
  <span>View as</span>
  <div class="seg" id="roleSeg">
    <button id="r-pro" data-role="pro">Professional (L1)</button>
    <button id="r-biz" data-role="biz">Business (L3)</button>
    <button id="r-admin" data-role="admin">Admin</button>
  </div>
  <div class="seg" id="langSeg">
    <button id="l-en" data-lang="en">EN</button>
    <button id="l-sw" data-lang="sw">SW</button>
  </div>
  <span class="note">Sample data only · Kiswahili is a draft for review</span>
</div>

<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function requests(){
  const open=REQS.filter(r=>!S.reqs[r.id]);
  const body=open.length?open.map(r=>`<div class="req">${av(initials(r.name),r.col,"sm")}<div class="tx"><b>${r.name}</b><div class="t">${r.title}</div>${r.note?`<div class="note">"${esc(r.note)}"</div>`:""}<div class="ago">${t("ago",{n:r.ago})}</div></div><div class="acts"><button class="btn" data-act="accept" data-id="${r.id}">${t("accept")}</button><button class="btn ghost" data-act="decline" data-id="${r.id}">${t("decline")}</button></div></div>`).join(""):`<div class="empty">${t("noReqs")}</div>`;
  return `<section class="card"><div class="hd"><h2>${t("reqs")}</h2><button class="link" data-act="soon" data-p="${t("connections")}">${t("viewAll")}</button></div><div class="bd">${body}</div></section>`;
}
function latest(){
  const tabs=[["all","all"],["jobs","jobs"],["training","trainingTab"],["tenders","tenders"],["investments","investments"],["ideas","ideas"]];
  const rows=LATEST.filter(x=>S.tab==="all"||x.k===S.tab);
  const pal={"c-job":["var(--good-soft)","var(--good)"],"c-train":["var(--warn-soft)","var(--warn)"],"c-inv":["var(--violet-soft)","var(--violet)"],"c-tender":["var(--teal-soft)","var(--teal)"],"c-idea":["var(--rose-soft)","var(--rose)"],"c-event":["var(--blue-soft)","var(--blue)"]};
  return `<section class="card"><div class="hd"><h2>${t("latest")}</h2><button class="link" data-act="soon" data-p="${t("opportunities")}">${t("viewAll")}</button></div><div class="bd"><div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" id="tab-${k}" aria-selected="${S.tab===k}" data-tab="${k}">${t(l)}</button>`).join("")}</div>
  <div style="margin-top:6px">${rows.map(x=>`<div class="li"><span class="ti" style="background:${pal[x.cls][0]};color:${pal[x.cls][1]}">${ic(x.ico,16)}</span><div style="min-width:0"><b>${x.title}</b><div class="meta"><span class="chip ${x.cls}">${t(x.type)}</span><span>${x.who==="anon"?t("anon"):x.who}</span>${x.loc?`<span>· ${x.loc}</span>`:""}<span>· ${t("ago",{n:x.ago})}</span></div></div></div>`).join("")}</div></div></section>`;
}
function featured(){
  const admin=S.role==="admin";
  const list=FEAT.filter(f=>S.featured.includes(f.id));
  return `<section class="card"><div class="hd"><h2>${t("featured")}</h2>${admin?`<span class="slots num">${t("slots",{n:list.length})}</span>`:`<button class="link" data-act="soon" data-p="${t("opportunities")}">${t("viewAll")}</button>`}</div><div class="bd">${list.map(f=>{
    const b=admin?`<button class="btn ghost" data-act="unfeature" data-id="${f.id}">${t("unfeature")}</button>`:S.applied[f.id]?`<button class="btn done" disabled>${ic("check",14)}${t("applied")}</button>`:f.btn==="apply"?`<button class="btn" data-act="apply" data-id="${f.id}">${t("apply")}</button>`:`<button class="btn" data-act="soon" data-p="${f.title}">${t("view")}</button>`;
    return `<div class="feat"><span class="logo" style="background:${f.col}">${f.init}</span><div class="tx"><b>${f.title}</b><div class="org">${f.org}</div><div class="meta">${ic("pin",12)}${loc(f.loc)} · ${t("ago",{n:f.ago})}</div></div><div class="rt"><span class="chip ${f.cls}">${t(f.type)}</span>${b}</div></div>`}).join("")}</div></section>`;
}
function quick(){
  let q;
  if(S.role==="admin")q=[["postOpp","postOppAdminS","briefcase","blue"],["postTender","postTenderS","building","teal"],["postNews","postNewsS","news","warn"],["featureOpp","featureOppS","star","violet"]];
  else q=[["postOpp",S.role==="biz"?"postOppS":"lockedS","briefcase","blue",S.role!=="biz"],["shareIdea","shareIdeaS","bulb","warn"],["scan","scanS","radar","violet"],["postTrain","postTrainS","book","good"]];
  return `<section class="card"><div class="hd"><h2>${t("qa")}</h2></div><div class="bd"><div class="qa">${q.map(([l,s,i,c,locked])=>`<button class="${locked?"locked":""}" data-act="${locked?"upgrade":"soon"}" data-p="${t(l)}"><span class="qi" style="background:var(--${c}-soft);color:var(--${c})">${ic(locked?"lock":i,16)}</span><b>${t(l)}</b><span>${t(s)}</span></button>`).join("")}</div></div></section>`;
}
function activity(){
  const a=S.role==="biz"?[["3","aPosts","aPostsS"],["9","aRecv","aRecvS"],["1","aReg","aRegS"]]:[["2","aApps","aAppsS"],["1","aIdea","aIdeaS"],["1","aReg","aRegS"]];
  return `<section class="card"><div class="hd"><h2>${t("activity")}</h2></div><div class="bd"><div class="act">${a.map(([v,l,s])=>`<div><div class="v num">${v}</div><div class="l">${t(l)}</div><div class="s">${t(s)}</div></div>`).join("")}</div></div></section>`;
}
function news(){
  return `<section class="card"><div class="hd"><h2>${t("news")}</h2><button class="link" data-act="soon" data-p="${t("newsNav")}">${t("viewAll")}</button></div><div class="bd">${NEWS.map(n=>`<div class="news"><span class="art" style="background:${n.art}"></span><div><b>${S.lang==="sw"?n.titleSw:n.title}</b><p>${S.lang==="sw"?n.bodySw:n.body}</p><div class="d">${n.d}${n.pin?` <span class="chip c-event">${t("pinned")}</span>`:""}</div></div></div>`).join("")}</div></section>`;
}
function tile(label,val,sub,ico,c,q,f){
  return `<button class="card stat" data-act="queue" data-q="${q}" data-f="${f}"><span class="ico" style="background:var(--${c}-soft);color:var(--${c})">${ic(ico)}</span><span class="lbl">${label}</span><span class="val num">${val}</span>${sub?`<span class="foot">${sub}</span>`:""}</button>`;
}
function adminBody(){
  const vq=t("verifyQueue"),mq=t("modQueue");
  return `<div class="group"><h3>${t("gVerify")}</h3><div class="stats">
    ${tile(t("vMembers"),34,t("oldest",{d:3}),"users","blue",vq,t("vMembers"))}
    ${tile(t("vL2"),12,t("oldest",{d:2}),"building","teal",vq,t("vL2"))}
    ${tile(t("vL3"),5,t("oldest",{d:1}),"briefcase","violet",vq,t("vL3"))}
    ${tile(t("vInv"),3,"","eyeoff","warn",vq,t("vInv"))}</div></div>
  <div class="group"><h3>${t("gSafety")}</h3><div class="stats">
    ${tile(t("openReports"),6,"","flag","bad",t("reports"),t("openReports"))}
    ${tile(t("hidden"),2,"","eyeoff","bad",t("reports"),t("hidden"))}
    ${tile(t("rejected"),76,"","xcircle","warn",t("members"),t("rejected"))}
    ${tile(t("reverifyDue"),8,"","refresh","warn",t("reverify"),t("reverifyDue"))}</div></div>
  <div class="group"><h3>${t("gMod")}</h3><div class="stats">
    ${tile(t("mOpp"),9,"","briefcase","good",mq,t("mOpp"))}
    ${tile(t("mIdeas"),7,"","bulb","rose",mq,t("mIdeas"))}
    ${tile(t("mTrain"),4,"","book","warn",mq,t("mTrain"))}
    ${tile(t("mEvents"),2,"","calendar","blue",mq,t("mEvents"))}
    ${tile(t("mTenders"),3,"","building","teal",mq,t("mTenders"))}</div></div>
  <div class="group"><h3>${t("gInv")}</h3><div class="stats">
    ${tile(t("invActive"),41,"","eyeoff","violet",t("investors"),t("invActive"))}
    ${tile(t("invViews"),17,"","search","violet",t("audit"),t("invViews"))}</div></div>`;
}
function tabbar(){
  const items=S.role==="admin"?[["adminDashboard","home"],["verifyQueue","check",54],["modQueue","list",25],["reports","flag",6],["more","grid"]]:[["dashboard","home"],["people","users"],["opportunities","briefcase"],["messages","message",5],["more","grid"]];
  const lbl={adminDashboard:t("dashboard"),verifyQueue:S.lang==="sw"?"Thibitisha":"Verify",modQueue:S.lang==="sw"?"Dhibiti":"Moderate"};
  return items.map(([k,i,b],n)=>`<button class="${n===0?"on":""}" data-nav="${k}">${ic(i,20)}<span>${lbl[k]||t(k)}</span>${b?`<span class="badge num">${b}</span>`:""}</button>`).join("");
}
function render(){
  document.documentElement.lang=S.lang==="sw"?"sw":"en";
  document.querySelectorAll("#roleSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.role===S.role));
  document.querySelectorAll("#langSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
  const admin=S.role==="admin";
  const left=admin?`${welcome()}${stats()}${adminBody()}`:`${welcome()}${stats()}${pymk()}<div class="duo">${requests()}${latest()}</div>`;
  const right=admin?`${quick()}${featured()}${news()}`:`${featured()}${quick()}${activity()}${news()}`;
  document.getElementById("app").innerHTML=`${sidebar()}<div class="main">${topbar()}<div class="content"><div class="col">${left}</div><div class="col">${right}</div></div>${admin?"":`<div class="banner"><div><b>${t("banner")}</b><span>${t("bannerS")}</span></div><button class="btn" data-act="soon" data-p="${t("opportunities")}">${t("explore")}</button></div>`}</div>`;
  document.getElementById("tabbar").innerHTML=tabbar();
}
let tt;
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2600)}
const person=id=>PEOPLE.find(p=>p.id===id);

document.addEventListener("click",e=>{
  const r=e.target.closest("[data-role]");if(r){S.role=r.dataset.role;S.menu=null;save();render();return}
  const l=e.target.closest("[data-lang]");if(l){S.lang=l.dataset.lang;save();render();return}
  const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;render();document.getElementById("tab-"+S.tab)?.focus();return}
  const nv=e.target.closest("[data-nav]");if(nv){const k=nv.dataset.nav;if(k!=="dashboard"&&k!=="adminDashboard")toast(t("soon",{p:t(k)}));return}
  const b=e.target.closest("[data-act]");
  if(!b){if(S.menu){S.menu=null;render()}return}
  const id=b.dataset.id,a=b.dataset.act;
  if(a!=="menu"&&S.menu)S.menu=null;
  switch(a){
    case"connect":S.conn[id]="pending";render();toast(t("sent",{n:person(id).name}));break;
    case"withdraw":S.conn[id]="none";render();toast(t("withdrawn"));break;
    case"menu":S.menu=S.menu===id?null:id;render();break;
    case"report":render();toast(t("reported"));break;
    case"block":S.blocked[id]=true;render();toast(t("blocked",{n:person(id).name}));break;
    case"accept":S.reqs[id]="accepted";render();toast(`${REQS.find(x=>x.id===id).name}: ${S.lang==="sw"?"mmeungana. Sasa mnaweza kutumiana ujumbe.":"connected. You can now message each other."}`);break;
    case"decline":S.reqs[id]="declined";render();toast(S.lang==="sw"?"Ombi limekataliwa. Mtumaji hatajulishwa.":"Request declined. The sender is not notified.");break;
    case"apply":S.applied[id]=true;render();toast(S.lang==="sw"?"Ombi limetumwa pamoja na wasifu wako.":"Application sent with your profile.");break;
    case"unfeature":S.featured=S.featured.filter(x=>x!==id);render();break;
    case"upgrade":toast(S.lang==="sw"?"Inafungua uthibitishaji wa biashara: Ngazi ya 2, kisha Ngazi ya 3.":"Opens business verification: Level 2, then Level 3.");break;
    case"queue":toast(t("openQueue",{q:b.dataset.q,f:b.dataset.f}));break;
    case"report-general":toast(t("soon",{p:t("reportH")}));break;
    default:toast(t("soon",{p:b.dataset.p||""}));
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.menu){S.menu=null;render()}});
render();
</script>
