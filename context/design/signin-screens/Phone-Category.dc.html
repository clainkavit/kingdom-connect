<span style="display: flex; flex-direction: column; gap: 2px">

<span style="font-size: 13px; line-height: 1.4; color: #5A4A4E">My career: show my skills and find jobs</span>
</span>
</label>

<label style="display: flex; gap: 14px; align-items: flex-start; background: #FFFFFF; border: 2px solid #4A0E1A; border-radius: 18px; padding: 13px 14px">

<span style="font-size: 16px; font-weight: 700; color: #2A1A1E">Other</span>
