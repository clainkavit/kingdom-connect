<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Email code on a phone</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A0E1A}a:hover{color:#2A0610}
</style>
</helmet>
<div style="width: 430px; height: 900px; box-sizing: border-box; padding: 28px 20px; border-radius: 64px; background: #1E1416; font-family: Figtree, system-ui, sans-serif; color: #2A1A1E">
<div style="position: relative; width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: #F7F1EA; display: flex; flex-direction: column">
<span style="position: absolute; top: 12px; left: 140px; width: 110px; height: 30px; border-radius: 999px; background: #1E1416; z-index: 2"></span>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 58px 20px 0">
<a href="Phone-Login.dc.html" aria-label="Back to log in" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4D9CC; color: #4A0E1A; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<img src="logo.jpg" alt="Kingdom Connect" style="width: 56px; height: 50px; object-fit: cover; border-radius: 12px; display: block">
</div>

<form style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; padding: 36px 24px 28px" aria-labelledby="c-title">
<div style="width: 64px; height: 64px; border-radius: 20px; background: #4A0E1A; color: #F3E6D0; display: flex; align-items: center; justify-content: center; align-self: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; text-align: center">
<h1 id="c-title" style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 36px; line-height: 1.05; color: #4A0E1A">Check your email</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5A4A4E">We sent a 6-digit code to your email. It works for 10 minutes.</p>
</div>

<fieldset style="border: 0; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 13px; font-weight: 600; color: #5A4A4E; margin-bottom: 8px; text-align: center; width: 100%">Email code</legend>
<div style="display: flex; justify-content: center; gap: 8px">
<input aria-label="Digit 1" inputmode="numeric" maxlength="1" value="4" style="width: 48px; height: 58px; box-sizing: border-box; border: 1.5px solid #4A0E1A; border-radius: 14px; background: #FFFFFF; text-align: center; font: 700 24px Figtree, sans-serif; color: #2A1A1E">
<input aria-label="Digit 2" inputmode="numeric" maxlength="1" value="8" style="width: 48px; height: 58px; box-sizing: border-box; border: 1.5px solid #4A0E1A; border-radius: 14px; background: #FFFFFF; text-align: center; font: 700 24px Figtree, sans-serif; color: #2A1A1E">
<input aria-label="Digit 3" inputmode="numeric" maxlength="1" value="1" style="width: 48px; height: 58px; box-sizing: border-box; border: 1.5px solid #4A0E1A; border-radius: 14px; background: #FFFFFF; text-align: center; font: 700 24px Figtree, sans-serif; color: #2A1A1E">
<input aria-label="Digit 4" inputmode="numeric" maxlength="1" style="width: 48px; height: 58px; box-sizing: border-box; border: 2px solid #E7C36A; border-radius: 14px; background: #FFFFFF; text-align: center; font: 700 24px Figtree, sans-serif; color: #2A1A1E">
<input aria-label="Digit 5" inputmode="numeric" maxlength="1" style="width: 48px; height: 58px; box-sizing: border-box; border: 1px solid #D9CBBB; border-radius: 14px; background: #FFFFFF; text-align: center; font: 700 24px Figtree, sans-serif; color: #2A1A1E">
<input aria-label="Digit 6" inputmode="numeric" maxlength="1" style="width: 48px; height: 58px; box-sizing: border-box; border: 1px solid #D9CBBB; border-radius: 14px; background: #FFFFFF; text-align: center; font: 700 24px Figtree, sans-serif; color: #2A1A1E">
</div>
</fieldset>

<a href="Phone-Details.dc.html" style="min-height: 56px; margin-top: 8px; border-radius: 999px; background: #4A0E1A; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">Verify</a>
<button type="button" disabled style="min-height: 48px; border: 0; background: transparent; color: #5A4A4E; font: 600 14px Figtree, sans-serif">Send a new code in 42s</button>

<div style="flex: 1 1 auto"></div>
<p style="margin: 0; text-align: center; font-size: 14px; color: #5A4A4E"><a href="Phone-Recover.dc.html" style="font-weight: 600">Can't get the code?</a></p>
</form>

</div>
</div>
