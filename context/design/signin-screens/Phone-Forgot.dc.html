<div style="position: relative; width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: #F7F1EA; display: flex; flex-direction: column">
<span style="position: absolute; top: 12px; left: 140px; width: 110px; height: 30px; border-radius: 999px; background: #1E1416; z-index: 2"></span>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 58px 20px 0">
<a href="Phone-Login.dc.html" aria-label="Back to log in" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4D9CC; color: #4A0E1A; display: flex; align-items: center; justify-content: center; box-sizing: border-box">

</a>
<img src="logo.jpg" alt="Kingdom Connect" style="width: 56px; height: 50px; object-fit: cover; border-radius: 12px; display: block">
</div>

<form style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; padding: 36px 24px 28px" aria-labelledby="f-title">
<div style="width: 64px; height: 64px; border-radius: 20px; background: #4A0E1A; color: #F3E6D0; display: flex; align-items: center; justify-content: center; align-self: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9"></path><path d="M17 6l3 3"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; text-align: center">

<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5A4A4E">Enter your username. We send a 6-digit code to the email on your account, then you choose a new password.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 5px; margin-top: 8px">
<label for="f-username" style="font-size: 13px; font-weight: 600; color: #5A4A4E; padding-left: 18px">Username</label>
<input id="f-username" type="text" autocomplete="username" placeholder="e.g. neema.joseph" style="min-height: 52px; box-sizing: border-box; width: 100%; border: 1px solid #D9CBBB; border-radius: 999px; background: #FFFFFF; padding: 0 20px; font: 400 15px Figtree, sans-serif; color: #2A1A1E">

<div style="flex: 1 1 auto"></div>
<p style="margin: 0; text-align: center; font-size: 14px; color: #5A4A4E">No longer have that email? <a href="Phone-Recover.dc.html" style="font-weight: 600">Get back into your account</a></p>
<p style="margin: 0; text-align: center; font-size: 14px; color: #5A4A4E"><a href="Phone-Login.dc.html" style="font-weight: 600">Back to log in</a></p>
