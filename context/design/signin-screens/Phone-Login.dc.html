<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in on a phone</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A0E1A}a:hover{color:#2A0610}
input::placeholder{color:#7A6A6E}
</style>
</helmet>
<div style="width: 430px; height: 900px; box-sizing: border-box; padding: 28px 20px; border-radius: 64px; background: #1E1416; font-family: Figtree, system-ui, sans-serif; color: #2A1A1E">
<div style="position: relative; width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: #F7F1EA; display: flex; flex-direction: column">
<span style="position: absolute; top: 12px; left: 140px; width: 110px; height: 30px; border-radius: 999px; background: #1E1416; z-index: 2"></span>

<div style="position: relative; height: 220px; flex-shrink: 0; background: #4A0E1A">
<img src="hands-photo.jpg" alt="Hands of people of different skin tones joined together in a circle" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block">
<div style="position: absolute; top: 56px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: space-between">
<img src="logo.jpg" alt="Kingdom Connect" style="width: 56px; height: 50px; object-fit: cover; border-radius: 12px; display: block">
<div style="display: flex; gap: 4px; background: #FFFFFF; border-radius: 999px; padding: 4px">
<button type="button" aria-pressed="true" style="min-height: 36px; min-width: 44px; border: 0; border-radius: 999px; background: #4A0E1A; color: #FFFFFF; font: 600 13px Figtree, sans-serif">EN</button>
<button type="button" aria-pressed="false" style="min-height: 36px; min-width: 44px; border: 0; border-radius: 999px; background: transparent; color: #5A4A4E; font: 600 13px Figtree, sans-serif">SW</button>
</div>
</div>
</div>

<form style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; padding: 26px 22px 24px; margin-top: -22px; border-radius: 26px 26px 0 0; background: #F7F1EA; position: relative" aria-labelledby="m-login-title">
<div style="display: flex; flex-direction: column; gap: 6px; text-align: center; margin-bottom: 6px">
<h1 id="m-login-title" style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 34px; line-height: 1.05; color: #4A0E1A">Log in to Kingdom Connect</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5A4A4E">After your password, we send a 6-digit code to your email.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 5px">
<label for="l-username" style="font-size: 13px; font-weight: 600; color: #5A4A4E; padding-left: 18px">Username</label>
<input id="l-username" type="text" autocomplete="username" placeholder="e.g. neema.joseph" style="min-height: 52px; box-sizing: border-box; width: 100%; border: 1px solid #D9CBBB; border-radius: 999px; background: #FFFFFF; padding: 0 20px; font: 400 15px Figtree, sans-serif; color: #2A1A1E">
</div>

<div style="display: flex; flex-direction: column; gap: 5px">
<label for="l-password" style="font-size: 13px; font-weight: 600; color: #5A4A4E; padding-left: 18px">Password</label>
<div style="position: relative">
<input id="l-password" type="password" autocomplete="current-password" style="min-height: 52px; box-sizing: border-box; width: 100%; border: 1px solid #D9CBBB; border-radius: 999px; background: #FFFFFF; padding: 0 54px 0 20px; font: 400 15px Figtree, sans-serif; color: #2A1A1E">
<button type="button" aria-label="Show password" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #5A4A4E; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
</div>

<a href="Phone-Forgot.dc.html" style="align-self: flex-end; min-height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 14px; font-weight: 600; margin-top: -6px">Forgot password?</a>

<a href="Phone-Code.dc.html" style="min-height: 56px; margin-top: 0; border-radius: 999px; background: #4A0E1A; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">Log in</a>

<div style="flex: 1 1 auto"></div>
<p style="margin: 0; text-align: center; font-size: 14px; color: #5A4A4E">New here? <a href="Phone-Signup.dc.html" style="font-weight: 600">Create an account</a></p>
<p style="margin: 0; display: flex; justify-content: center; gap: 18px; font-size: 13px"><a href="#terms">Terms of use</a><a href="#privacy">Privacy notice</a></p>
</form>

</div>
</div>
</x-dc>

return {};
}
}
</script>
</body>
</html>
