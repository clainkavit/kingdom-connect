<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Registration about you on a computer</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F1EA}
a{color:#4A0E1A}a:hover{color:#2A0610}
input::placeholder{color:#7A6A6E}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; padding: 24px; background: #F7F1EA; font-family: Figtree, system-ui, sans-serif; color: #2A1A1E; display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">
<aside style="flex: 1 1 300px; min-width: 0; box-sizing: border-box; border-radius: 28px; background: #4A0E1A; padding: 32px; display: flex; flex-direction: column; gap: 32px">
<img src="logo.jpg" alt="Kingdom Connect" style="width: 84px; height: 76px; object-fit: cover; border-radius: 14px; display: block">
<span style="font-size: 14px; font-weight: 700; color: #E7C36A">Step 1 of 6</span>
<ol aria-label="Registration steps" style="list-style: none; margin: -16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<li style="display: flex; align-items: center; gap: 14px; min-height: 44px"><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 999px; border: 2px solid #E7C36A; background: #FFFFFF; color: #4A0E1A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0">1</span><span aria-current="step" style="color: #FFFFFF; font-size: 15px; font-weight: 700">About you</span></li>
<li style="display: flex; align-items: center; gap: 14px; min-height: 44px"><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(243,230,208,0.55); color: #F3E6D0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0">2</span><span style="color: #E9DCCB; font-size: 15px">Category</span></li>
<li style="display: flex; align-items: center; gap: 14px; min-height: 44px"><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(243,230,208,0.55); color: #F3E6D0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0">3</span><span style="color: #E9DCCB; font-size: 15px">Your work</span></li>
<li style="display: flex; align-items: center; gap: 14px; min-height: 44px"><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(243,230,208,0.55); color: #F3E6D0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0">4</span><span style="color: #E9DCCB; font-size: 15px">ID and photos</span></li>
<li style="display: flex; align-items: center; gap: 14px; min-height: 44px"><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(243,230,208,0.55); color: #F3E6D0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0">5</span><span style="color: #E9DCCB; font-size: 15px">Terms and privacy</span></li>
<li style="display: flex; align-items: center; gap: 14px; min-height: 44px"><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid rgba(243,230,208,0.55); color: #F3E6D0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0">6</span><span style="color: #E9DCCB; font-size: 15px">Check and send</span></li>
</ol>
<div style="flex: 1 1 auto"></div>
<a href="Web-Landing.dc.html" style="color: #FFFFFF; font-size: 14px; font-weight: 600; min-height: 44px; display: flex; align-items: center">Save and exit</a>
</aside>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px 32px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: flex-end"><div style="display: flex; align-items: center; gap: 4px; border: 1px solid #E4D9CC; border-radius: 999px; padding: 4px">
<button type="button" aria-pressed="true" style="min-height: 36px; min-width: 44px; border: 0; border-radius: 999px; background: #4A0E1A; color: #FFFFFF; font: 600 13px Figtree, sans-serif">EN</button>
<button type="button" aria-pressed="false" style="min-height: 36px; min-width: 44px; border: 0; border-radius: 999px; background: transparent; color: #5A4A4E; font: 600 13px Figtree, sans-serif">SW</button>
</div></div>
<div style="flex: 1 1 auto; display: flex; justify-content: center; padding: 24px 0">
<form style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 20px" aria-labelledby="w-title">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 id="w-title" style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 44px; line-height: 1.05; color: #4A0E1A">About you</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5A4A4E">Write your name exactly as it is on your ID.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="wd-name" style="font-size: 13px; font-weight: 600; color: #5A4A4E; padding-left: 18px">Full name</label>
<input id="wd-name" type="text" placeholder="e.g. Neema Joseph Mushi" autocomplete="name" style="min-height: 52px; box-sizing: border-box; width: 100%; border: 1px solid #D9CBBB; border-radius: 999px; background: #FFFFFF; padding: 0 20px; font: 400 15px Figtree, sans-serif; color: #2A1A1E">
</div><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="wd-region" style="font-size: 13px; font-weight: 600; color: #5A4A4E; padding-left: 18px">Region</label>
<select id="wd-region" style="min-height: 52px; box-sizing: border-box; width: 100%; border: 1px solid #D9CBBB; border-radius: 999px; background: #FFFFFF; padding: 0 18px; font: 400 15px Figtree, sans-serif; color: #2A1A1E"><option>Choose</option><option selected>Dar es Salaam</option><option>Arusha</option><option>Dodoma</option><option>Mwanza</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="wd-district" style="font-size: 13px; font-weight: 600; color: #5A4A4E; padding-left: 18px">District</label>
<select id="wd-district" style="min-height: 52px; box-sizing: border-box; width: 100%; border: 1px solid #D9CBBB; border-radius: 999px; background: #FFFFFF; padding: 0 18px; font: 400 15px Figtree, sans-serif; color: #2A1A1E"><option>Choose</option><option selected>Kinondoni</option><option>Ilala</option><option>Temeke</option><option>Ubungo</option><option>Kigamboni</option></select>
</div></div><fieldset style="border: 1px solid #E4D9CC; border-radius: 22px; margin: 0; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF">
<legend style="font-size: 15px; font-weight: 700; color: #4A0E1A; padding: 0 8px">Studies (optional)</legend>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="wd-school" style="font-size: 13px; font-weight: 600; color: #5A4A4E; padding-left: 18px">School, college or university</label>
<input id="wd-school" type="text" placeholder="e.g. University of Dar es Salaam" style="min-height: 52px; box-sizing: border-box; width: 100%; border: 1px solid #D9CBBB; border-radius: 999px; background: #FFFFFF; padding: 0 20px; font: 400 15px Figtree, sans-serif; color: #2A1A1E">
</div><div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="wd-course" style="font-size: 13px; font-weight: 600; color: #5A4A4E; padding-left: 18px">Course</label>
<input id="wd-course" type="text" placeholder="e.g. Accounting" style="min-height: 52px; box-sizing: border-box; width: 100%; border: 1px solid #D9CBBB; border-radius: 999px; background: #FFFFFF; padding: 0 20px; font: 400 15px Figtree, sans-serif; color: #2A1A1E">
</div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="wd-year" style="font-size: 13px; font-weight: 600; color: #5A4A4E; padding-left: 18px">Year</label>
<input id="wd-year" type="text" placeholder="2024" inputmode="numeric" style="min-height: 52px; box-sizing: border-box; width: 100%; border: 1px solid #D9CBBB; border-radius: 999px; background: #FFFFFF; padding: 0 20px; font: 400 15px Figtree, sans-serif; color: #2A1A1E">
</div></div>
</fieldset>
<p style="margin: 0; font-size: 14px; color: #5A4A4E">Each step is saved, so you can stop and carry on later.</p>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 12px; border-top: 1px solid #E4D9CC; padding-top: 20px">
<span></span>
<a href="Web-Category.dc.html" style="min-height: 56px; padding: 0 32px; border-radius: 999px; background: #4A0E1A; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">Continue</a>
</div>
</form>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
